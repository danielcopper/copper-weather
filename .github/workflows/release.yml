name: Release

# release-please decides the version, the tag and the changelog from the
# Conventional Commits on main: it keeps a release PR open, and merging that
# PR writes the version into version.txt (the app's versionName,
# app/build.gradle.kts), updates CHANGELOG.md, and tags the release.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Serialize releases: two quick pushes to main must not run release-please
# concurrently and race on the release PR / tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Mint a GitHub App installation token so release-please's PR/branch
      # pushes are authored by the App, not GITHUB_TOKEN. Pushes made with
      # GITHUB_TOKEN do not trigger workflows (anti-recursion), which would
      # leave the release PR's required status checks stuck "Expected" and
      # unmergeable. An App token makes those checks run automatically.
      # Scope it to exactly what release-please needs (contents + PRs).
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
